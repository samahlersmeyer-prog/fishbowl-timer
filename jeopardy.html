<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Thanksgiving Jeopardy</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Alfa+Slab+One&family=Archivo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
/* VOICE: a game-show night at the family table — loud, warm, easy to read from the couch.
   IDEA: the TV quiz board, re-upholstered in harvest colours: cranberry tiles, gold dollar values.
   PICTURE: the 6×5 board itself, filling the screen; clues open full-screen like on TV.
   COLOUR and TYPE: deep cranberry ground, plum tiles, harvest gold values, pumpkin accent; Alfa Slab One + Archivo.
   LAYOUT: modest title bar, board, then team scoreboard band; stacks tighter on phones. */
:root{color-scheme:dark;--bg:#2a0a14;--tile:#5c1428;--tile2:#741a33;--used:#3a0e1b;--gold:#f6b93b;--pump:#ef7d1a;--ink:#fff4e6;--mute:#d9b8a8;--line:#ffffff1f}
*{box-sizing:border-box;min-width:0}
body{margin:0;background:radial-gradient(1200px 600px at 50% -10%,#4a1020,var(--bg));color:var(--ink);font:16px/1.5 Archivo,system-ui,sans-serif;overflow-x:clip;min-height:100vh}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible,input:focus-visible{outline:3px solid var(--gold);outline-offset:2px}
header{display:flex;flex-wrap:wrap;align-items:center;gap:12px 20px;justify-content:space-between;padding:16px max(3vw,14px) 10px}
h1{font:400 clamp(26px,4vw,42px)/1.05 "Alfa Slab One",Georgia,serif;margin:0;color:var(--gold);text-shadow:0 3px 0 #0006}
h1 span{color:var(--ink)}
.tools{display:flex;flex-wrap:wrap;gap:8px}
.btn{min-height:44px;padding:0 16px;border-radius:10px;background:#ffffff14;border:1px solid var(--line);font-weight:600}
a.btn{display:inline-flex;align-items:center;color:var(--ink);text-decoration:none}
.btn:hover{background:#ffffff24}
.btn.hot{background:var(--pump);border-color:transparent;color:#2a0a14;font-weight:800}
.btn.hot:hover{background:#ff9338}
.btn.warn{background:#b3261e;border-color:transparent}
main{padding:0 max(3vw,14px)}
.board{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:clamp(4px,.8vw,10px);max-width:1400px;margin:0 auto}
.cat{background:var(--tile2);border-radius:10px;padding:10px 6px;min-height:clamp(56px,8vw,90px);display:grid;place-items:center;text-align:center;font-weight:800;font-size:clamp(11px,1.5vw,19px);line-height:1.15;text-transform:uppercase;letter-spacing:.02em;box-shadow:inset 0 -4px 0 #0004;overflow-wrap:anywhere}
.tile{background:linear-gradient(#6a1830,var(--tile));border-radius:10px;min-height:clamp(52px,9vh,110px);font:400 clamp(18px,3.2vw,46px)/1 "Alfa Slab One",Georgia,serif;color:var(--gold);text-shadow:0 3px 0 #0007;box-shadow:inset 0 2px 0 #ffffff1a,inset 0 -5px 0 #0005,0 4px 10px #0004;transition:transform .12s}
.tile:hover:not(:disabled){transform:translateY(-2px);background:linear-gradient(#80203b,#6a1830)}
.tile:disabled{background:var(--used);color:transparent;text-shadow:none;box-shadow:inset 0 0 0 1px var(--line);cursor:default}
.teams{display:flex;flex-wrap:wrap;gap:12px;justify-content:center;max-width:1400px;margin:18px auto 0;padding-bottom:28px}
.team{background:#ffffff0f;border:1px solid var(--line);border-radius:14px;padding:12px 14px;width:min(240px,100%);display:grid;gap:6px;text-align:center}
.team input{font:600 16px Archivo,sans-serif;text-align:center;background:transparent;border:0;border-bottom:1px dashed #ffffff40;color:var(--ink);padding:4px;width:100%}
.score{font:400 clamp(26px,3vw,36px)/1.1 "Alfa Slab One",Georgia,serif;color:var(--gold);white-space:nowrap}
.score.neg{color:#ff8a7a}
.adj{display:flex;gap:6px;justify-content:center}
.adj button{min-width:44px;min-height:36px;border-radius:8px;background:#ffffff14;font-size:13px;font-weight:600}
.adj .x{color:var(--mute)}
.addteam{border:2px dashed #ffffff30;border-radius:14px;width:min(160px,100%);min-height:120px;color:var(--mute);font-weight:600}
.note{text-align:center;color:var(--mute);font-size:13px;margin:0;padding-bottom:20px}
/* clue overlay */
.ov{position:fixed;inset:0;background:radial-gradient(circle at 50% 40%,#7a1c36,#2a0a14 75%);display:none;flex-direction:column;align-items:center;justify-content:center;padding:clamp(18px,4vw,56px);z-index:10;text-align:center;overflow-y:auto}
.ov.open{display:flex}
.ov .meta{font-weight:800;text-transform:uppercase;letter-spacing:.04em;color:var(--mute);font-size:clamp(13px,1.6vw,18px)}
.ov .dd{font:400 clamp(36px,7vw,84px)/1 "Alfa Slab One",Georgia,serif;color:var(--pump);margin:8px 0 18px;text-shadow:0 4px 0 #0007}
.clue{font:400 clamp(24px,4.4vw,58px)/1.18 "Alfa Slab One",Georgia,serif;max-width:1100px;text-wrap:balance;margin:14px 0 22px;text-shadow:0 3px 0 #0006}
.ans{font:800 clamp(20px,3vw,36px)/1.2 Archivo,sans-serif;color:var(--gold);min-height:1.2em;margin-bottom:22px;text-wrap:balance}
.row{display:flex;flex-wrap:wrap;gap:10px;justify-content:center;max-width:1000px}
.judge{background:#00000033;border:1px solid var(--line);border-radius:12px;padding:8px 10px;display:flex;align-items:center;gap:8px}
.judge b{font-weight:600;max-width:12ch;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.judge button{min-width:44px;min-height:44px;border-radius:8px;font-weight:800;font-size:18px}
.judge .ok{background:#2e7d32}.judge .no{background:#b3261e}
.judge.done{opacity:.45}
.wager{display:flex;align-items:center;gap:8px;background:#00000033;border:1px solid var(--line);border-radius:12px;padding:8px 12px}
.wager input{width:7em;font:600 16px Archivo,sans-serif;padding:8px;border-radius:8px;border:1px solid #ffffff40;background:#ffffff10;color:var(--ink)}
select{font:600 16px Archivo,sans-serif;min-height:44px;padding:0 10px;border-radius:8px;background:#3a0e1b;color:var(--ink);border:1px solid #ffffff40}
.close{position:absolute;top:14px;right:14px}
.big{min-height:52px;padding:0 26px;font-size:18px}
@media(max-width:600px){.tile{min-height:48px;border-radius:7px}.cat{border-radius:7px;padding:6px 3px}.team{width:calc(50% - 6px)}.addteam{width:calc(50% - 6px)}}
.brand{display:flex;flex-wrap:wrap;align-items:center;gap:12px 16px}
.seg{display:flex;border:1px solid var(--line);border-radius:12px;overflow:hidden}
.seg button{min-height:44px;padding:0 14px;font-weight:600;background:#ffffff0d}
.seg button[aria-pressed=true]{background:var(--gold);color:#2a0a14;font-weight:800}
.brand svg{width:clamp(48px,6vw,72px);height:clamp(48px,6vw,72px);flex:none;animation:bob 1.6s ease-in-out infinite;transform-origin:50% 90%}
.tile{position:relative;overflow:hidden}
.tile .mini{position:absolute;inset:12%;width:76%;height:76%;opacity:.4}
.tile:hover .peek{opacity:1;transform:translateY(0)}
.peek{position:absolute;right:4px;bottom:2px;width:30%;height:45%;opacity:0;transform:translateY(40%);transition:.2s;pointer-events:none}
select.sm{min-height:44px}
.timer{display:flex;align-items:center;gap:12px;width:min(900px,100%);margin:62px 0 4px}
.track{position:relative;flex:1;height:14px;border-radius:99px;background:#00000055;box-shadow:inset 0 0 0 1px var(--line)}
.fill{position:absolute;inset:0 auto 0 0;border-radius:99px;background:linear-gradient(90deg,var(--gold),var(--pump));width:100%}
.walker{position:absolute;top:-44px;width:52px;height:52px;margin-left:-26px;left:100%;animation:bob .45s ease-in-out infinite;transform-origin:50% 90%}
.again{position:absolute;top:14px;left:14px}
.host{position:absolute;left:clamp(6px,2vw,28px);bottom:clamp(6px,2vw,24px);width:clamp(100px,12vw,160px);pointer-events:none}
.host svg{width:100%;aspect-ratio:1;display:block;transform-origin:50% 95%}
.host.talk svg{animation:talk .28s ease-in-out infinite}
.bubble{position:absolute;bottom:98%;left:4px;background:#fff4e6;color:#2a0a14;font-weight:800;font-size:clamp(13px,1.4vw,16px);line-height:1.25;padding:8px 12px;border-radius:14px 14px 14px 4px;width:max-content;max-width:min(170px,60vw);opacity:0;transition:opacity .2s}
.host.talk .bubble,.bubble.show{opacity:1}
@keyframes talk{0%,100%{transform:rotate(-3deg) scaleY(1)}50%{transform:rotate(3deg) scaleY(.94)}}
@media(max-width:700px){.host{width:84px}.bubble{font-size:13px}.ov{padding-bottom:110px}}
.chaser{position:absolute;top:-56px;width:64px;height:64px;margin-left:-32px;left:100%}
.timer.caught .walker{animation:escape 1.6s ease-out forwards}
.timer.caught .chaser{animation:tumble 1s ease-out forwards}
@keyframes escape{0%{transform:none}30%{transform:translateY(-90px) rotate(360deg) scale(1.4)}60%{transform:translateY(-30px) rotate(720deg) scale(1.2)}80%{transform:translateY(-60px) rotate(900deg)}100%{transform:translateY(0) rotate(1080deg)}}
@keyframes tumble{0%{transform:none}40%{transform:rotate(-30deg) translateY(-10px)}100%{transform:rotate(-95deg) translate(-14px,22px)}}
.tnum{font:400 clamp(26px,3vw,38px)/1 "Alfa Slab One",Georgia,serif;color:var(--gold);min-width:2.2ch;text-align:right;white-space:nowrap}
.timer.low .tnum{color:#ff8a7a}.timer.low .fill{background:#e53935}
.timer[hidden]{display:none}
.tbtn{min-width:44px;min-height:44px;border-radius:10px;background:#ffffff14;border:1px solid var(--line);font-weight:600;padding:0 12px}
.timesup{font:400 clamp(28px,5vw,60px)/1 "Alfa Slab One",Georgia,serif;color:#ff8a7a;animation:shake .5s 2}
.bigturk{width:clamp(110px,16vw,180px);height:clamp(110px,16vw,180px);animation:bob .8s ease-in-out infinite;transform-origin:50% 90%}
.strut{position:fixed;bottom:6px;width:56px;height:56px;left:-70px;animation:strut 18s linear infinite;opacity:.9;pointer-events:none;z-index:1}
@keyframes bob{0%,100%{transform:rotate(-4deg)}50%{transform:rotate(4deg) translateY(-3px)}}
@keyframes strut{to{left:calc(100% + 70px)}}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
@media(prefers-reduced-motion:reduce){.tile{transition:none}.brand svg,.walker,.bigturk,.timesup,.timer.caught .walker,.timer.caught .chaser,.host.talk svg{animation:none}.strut{display:none}}
</style>
</head>

<header>
  <div class="brand"><svg aria-hidden="true"><use href="#tk"/></svg><h1>Thanksgiving <span>Jeopardy!</span></h1>
    <div class="seg" role="group" aria-label="Choose a board"><button id="bKids" aria-pressed="true">Kids board</button><button id="bAdults" aria-pressed="false">Grown-ups board</button></div></div>
  <div class="tools">
    <a class="btn" href="./">⏱ Fishbowl</a>
    <label class="sr" for="tLen" style="position:absolute;left:-9999px">Timer length</label>
    <select class="sm" id="tLen" aria-label="Timer length"><option value="15" selected>15 sec timer</option><option value="30">30 sec timer</option><option value="45">45 sec timer</option><option value="60">60 sec timer</option><option value="0">No timer</option></select>
    <button class="btn" id="sndBtn" aria-pressed="true">Beat: on</button>
    <select class="sm" id="hostSel" aria-label="Choose the host"><option value="adults">Host: Preacher Turkey</option><option value="kids">Host: Southern Turkey</option><option value="coach">Host: Coach Turkey</option></select>
    <button class="btn" id="voiceBtn" aria-pressed="true">Host voice: on</button>
    <button class="btn hot" id="finalBtn">Final Jeopardy</button>
    <button class="btn" id="fsBtn">Full screen</button>
    <button class="btn" id="resetBtn">New game</button>
  </div>
</header>
<main>
  <div class="board" id="board"></div>
  <div class="teams" id="teams"></div>
  <svg class="strut" aria-hidden="true"><use href="#tk"/></svg>
  <p class="note">Click a dollar amount to open a clue. The 15-second music timer starts with each clue, and a gobble means time's up. Players answer in the form of a question. One hidden Daily Double is on the board. Tap a team name to rename it.</p>
</main>

<div class="ov" id="ov" role="dialog" aria-modal="true" aria-labelledby="ovClue">
  <button class="btn close" id="ovClose">Back to board</button>
  <button class="btn again" id="sayAgain">Read it again</button>
  <div class="host" id="host" aria-hidden="true"><div class="bubble" id="bubble"></div><svg><use id="hostUse" href="#tkp"/></svg></div>
  <div class="meta" id="ovMeta"></div>
  <div class="dd" id="ovDD" hidden><svg class="bigturk" aria-hidden="true"><use href="#tk"/></svg><br>Daily Double!</div>
  <div class="timer" id="timer" hidden>
    <div class="track"><div class="fill" id="tFill"></div><svg class="walker" id="tWalk" aria-hidden="true"><use href="#tk"/></svg><svg class="chaser" id="tChase" aria-hidden="true"><use href="#pil"/></svg></div>
    <span class="tnum" id="tNum" aria-live="off">15</span>
    <button class="tbtn" id="tPause">Pause</button>
  </div>
  <div class="row" id="ovPre"></div>
  <div class="clue" id="ovClue"></div>
  <div class="ans" id="ovAns"></div>
  <div class="row" id="ovAct"></div>
</div>

<script>
{
const KIDS=[
 {n:"Pilgrim Days",q:[
  ["The ship that carried the Pilgrims across the Atlantic in 1620","What is the Mayflower?"],
  ["The colony the Pilgrims founded in present-day Massachusetts","What is Plymouth?"],
  ["The Native American nation that shared the 1621 harvest feast with the Pilgrims","Who are the Wampanoag?"],
  ["This Wampanoag leader, or sachem, attended the 1621 feast with about 90 of his men","Who is Massasoit?"],
  ["This Patuxet man spoke English and taught the colonists how to grow corn","Who is Squanto (Tisquantum)?"]]},
 {n:"Talkin' Turkey",q:[
  ["A male turkey is called a gobbler or this three-letter name","What is a tom?"],
  ["A female turkey goes by this name, shared with chickens","What is a hen?"],
  ["Each year the U.S. President spares a turkey with this official act","What is a pardon?"],
  ["The fleshy red flap that dangles over a turkey's beak","What is a snood?"],
  ["In a letter to his daughter, this Founding Father called the turkey 'a much more respectable bird' than the bald eagle","Who is Benjamin Franklin?"]]},
 {n:"Parades & Pigskin",q:[
  ["The New York department store that has hosted a famous Thanksgiving parade since 1924","What is Macy's?"],
  ["This jolly figure traditionally rides the final float, kicking off the holiday season","Who is Santa Claus?"],
  ["This NFL team has hosted a Thanksgiving game nearly every year since 1934","Who are the Detroit Lions?"],
  ["Since 1966 (with two exceptions), this Texas team has also hosted on Thanksgiving","Who are the Dallas Cowboys?"],
  ["The giant parade balloons are filled with this gas, the same one that makes party balloons float","What is helium?"]]},
 {n:"On the Side",q:[

  ddAnn:"Whoa! Whap! Boom! It's a Daily Double! Now this is where ya find out who the real players are. How much ya gonna wager?",bDD:"DAILY DOUBLE! BOOM!",
  ddClue:n=>"Alright, "+n+", here's the snap. ",bDDClue:"Here's the snap!",
  finCat:c=>"Now this is the fourth quarter, folks! Two minute warning! Final Jeopardy! The category is: "+c+". Make your wagers!",
  finQ:"Here it comes. ",finEnd:"Thirty seconds on the clock. Write it down! Boom!",bFin:"Fourth quarter! BOOM!",
  win:w=>"Boom! Game over! "+w+" wins! And ya know what that means. Somebody gets a turkey leg! Happy Thanksgiving!"},
 adults:{svg:"#tkr",male:true,pitch:.88,rate:.93,vre:/guy|davis|andrew|christopher|roger|brian|aaron|fred|alex|tom|male/i,
  intros:["Church, can I get an amen?","Hallelujah, saints!","Somebody say gravy!","Brothers and sisters, lean in close now!","Turn with me now to the next clue!"],
  outros:["Can I get a witness? Answer now!","The spirit is moving, go on and answer!","Don't let that clock catch you sleeping in the back pew!","Somebody testify!"],
  right:["Glory! The answer is ","Say it with me, church: ","Amen and amen! That's "],
  bClue:v=>"For $"+v+"… can I get an amen?",
  ddAnn:"Oh, somebody has been blessed tonight! It's a Daily Double! Now how much faith have you got? Lay your wager on the altar!",bDD:"DAILY DOUBLE! Hallelujah!",
  ddClue:n=>"Alright, "+n+", the good Lord loves a cheerful wager. Here it comes. ",bDDClue:"Here it comes, saints!",
  finCat:c=>"Church, we have come to the final hymn of the evening. Final Jeopardy! The category is: "+c+". Lay your wagers down.",
  finQ:"Here it is, the last word. ",finEnd:"You have thirty seconds. Write it down and believe!",bFin:"Final Jeopardy! Amen!",
  win:w=>"Let the church say amen! "+w+" wins! Happy Thanksgiving, now somebody pass the sweet potato pie!"}
};
const hostKey=()=>KEY+"-host2-"+MODE;
let HOSTSEL={};
function hostFor(){if(HOSTSEL[MODE])return HOSTSEL[MODE];let v=null;try{v=localStorage.getItem(hostKey())}catch(e){}return HOSTSEL[MODE]=(v&&HOSTS[v])?v:(MODE==="adults"?"adults":"kids")}
const HH=()=>HOSTS[hostFor()];
function drawl(s){if(hostFor()!=="kids")return s; /* sprinkle a little Southern on the clue */
  return s.replace(/\bthis\b/g,"this here").replace(/\bThis\b/g,"This here").replace(/\byou\b/g,"y'all").replace(/\bgoing to\b/g,"fixin' to");
}
function hush(){sayTok++;if(SS)SS.cancel();$("host").classList.remove("talk");$("bubble").classList.remove("show")}
function say(text,bubble,done){
  hush();const tok=sayTok;lastSay=[text,bubble];
  $("bubble").textContent=bubble||"";
  const fin=()=>{if(tok!==sayTok)return;$("host").classList.remove("talk");if(bubble)$("bubble").classList.add("show");done&&done()};
  if(!voiceOn||!SS){if(bubble)$("bubble").classList.add("show");done&&done();return}
  const H=HH(),v=pickVoice();
  /* speak sentence by sentence, varying pitch and pace so it sounds less like a robot */
  const parts=text.replace(/…/g,", ").split(/(?<=[.!?])\s+/).filter(x=>x.trim());
  let i=0,watchdog=null;
  const next=()=>{
    clearTimeout(watchdog);
    if(tok!==sayTok)return;
    if(i>=parts.length){fin();return}
    const s=parts[i++],u=new SpeechSynthesisUtterance(s),ex=/!$/.test(s),q=/\?$/.test(s),short=s.length<28;
    if(v)u.voice=v;u.lang=(v&&v.lang)||"en-US";
    const j=(Math.random()-.5)*.06;
    u.pitch=Math.min(2,Math.max(.1,H.pitch+j+(ex?.07:0)+(q?.05:0)));
    u.rate=Math.min(2,H.rate+j*.5+(ex&&short?.12:0)+(i===1?.03:0));
    u.volume=1;
    u.onstart=()=>{if(tok===sayTok)$("host").classList.add("talk")};
    u.onend=()=>setTimeout(next,ex?60:120);u.onerror=()=>next();
    watchdog=setTimeout(()=>{if(tok===sayTok&&!SS.speaking)next()},Math.max(2500,s.length*110));
    SS.speak(u);
  };
  next();
}
if(SS&&SS.onvoiceschanged!==undefined)SS.onvoiceschanged=()=>{};
$("sayAgain").onclick=()=>{if(lastSay)say(lastSay[0],lastSay[1])};
/* overlay */
const ov=$("ov");
let lastFocus=null;
function openOv(){lastFocus=document.activeElement;ov.classList.add("open");$("ovClose").focus()}
function closeOv(){hideTimer();hush();ov.classList.remove("open");render();if(lastFocus&&document.body.contains(lastFocus))lastFocus.focus()}
$("ovClose").onclick=closeOv;
document.addEventListener("keydown",e=>{if(e.key==="Escape"&&ov.classList.contains("open"))closeOv()});

function judges(getVal,onDone){
  $("ovAct").innerHTML=S.teams.map((t,i)=>`<div class="judge" data-j="${i}"><b>${esc(t.n)}</b><button class="ok" data-ok="${i}" aria-label="${esc(t.n)} correct">✓</button><button class="no" data-no="${i}" aria-label="${esc(t.n)} wrong">✗</button></div>`).join("")+`<button class="btn big hot" id="doneBtn">Done</button>`;
  $("ovAct").onclick=e=>{
    const b=e.target.closest("button");if(!b)return;
    if(b.id==="doneBtn"){onDone&&onDone();closeOv();return}
    const i=b.dataset.ok??b.dataset.no;if(i==null)return;
    const j=b.closest(".judge");if(j.classList.contains("done"))return;
    S.teams[i].s+=(b.dataset.ok!=null?1:-1)*getVal(+i);j.classList.add("done");save();
    if(b.dataset.ok!=null&&!onDone){$("ovAns").textContent=$("ovAns").textContent||$("ovAns").dataset.a}
  };
}
function revealBtn(a,after){
  $("ovAns").textContent="";$("ovAns").dataset.a=a;
  $("ovAct").innerHTML=`<button class="btn big hot" id="revBtn">Reveal answer</button>`;
  $("ovAct").onclick=e=>{if(e.target.id==="revBtn"){stopTimer();$("ovAns").textContent=a;say(pick(HH().right)+a,a);after()}};
}

$("board").addEventListener("click",e=>{
  const t=e.target.closest(".tile");if(!t||t.disabled)return;
  const c=+t.dataset.c,r=+t.dataset.r,[q,a]=CATS[c].q[r],val=VALS[r];
  S.used.push(c+"-"+r);save();
  const isDD=S.dd[0]===c&&S.dd[1]===r;hideTimer();
  $("ovMeta").textContent=CATS[c].n+" · $"+val;
  $("ovDD").hidden=!isDD;$("ovAns").textContent="";$("ovPre").innerHTML="";
  if(isDD){
    $("ovClue").textContent="";
    const max=i=>Math.max(S.teams[i].s,500);
    $("ovPre").innerHTML=`<div class="wager"><label for="ddTeam">Team</label><select id="ddTeam">${S.teams.map((x,i)=>`<option value="${i}">${esc(x.n)}</option>`).join("")}</select>
      <label for="ddW">Wager</label><input id="ddW" type="number" inputmode="numeric" min="0" step="100" value="${val}"></div>`;
    const maxNote=()=>{$("ovMeta").textContent=CATS[c].n+" · wager up to "+fmt(max(+$("ddTeam").value))};
    $("ddTeam").onchange=maxNote;maxNote();
    say(HH().ddAnn,HH().bDD);
    $("ovAct").innerHTML=`<button class="btn big hot" id="ddGo">Show the clue</button>`;
    $("ovAct").onclick=ev=>{
      if(ev.target.id!=="ddGo")return;
      const ti=+$("ddTeam").value,w=Math.min(Math.max(0,Math.round(+$("ddW").value||0)),max(ti));
      $("ovPre").innerHTML=`<div class="meta">${esc(S.teams[ti].n)} wagers ${fmt(w)}</div>`;
      $("ovClue").textContent=q;
      say(HH().ddClue(S.teams[ti].n)+drawl(q)+". "+pick(HH().outros),HH().bDDClue,()=>{if(ov.classList.contains("open")&&!$("ovAns").textContent)startTimer()});
      revealBtn(a,()=>{
        $("ovAct").innerHTML=`<button class="btn big" style="background:#2e7d32" id="ddR">Correct +${fmt(w)}</button><button class="btn big warn" id="ddX">Wrong −${fmt(w)}</button>`;
        $("ovAct").onclick=e2=>{if(e2.target.id==="ddR"){S.teams[ti].s+=w;closeOv()}else if(e2.target.id==="ddX"){S.teams[ti].s-=w;closeOv()}};
      });
    };
  }else{
    $("ovClue").textContent=q;
    revealBtn(a,()=>judges(()=>val));
    /* judging also available before reveal: show buttons under reveal */
    const rev=$("ovAct").innerHTML;
    judges(()=>val);
    $("ovAct").insertAdjacentHTML("afterbegin",rev);
    const inner=$("ovAct").onclick;
    $("ovAct").onclick=ev=>{if(ev.target.id==="revBtn"){stopTimer();$("ovAns").textContent=a;say(pick(HH().right)+a,a);ev.target.remove();return}inner(ev)};
    say(pick(HH().intros)+" For "+val+" dollars, in "+CATS[c].n+". "+drawl(q)+". "+pick(HH().outros),HH().bClue(val),()=>{if(ov.classList.contains("open")&&!$("ovAns").textContent)startTimer()});
  }
  render();openOv();
});

/* final jeopardy */
$("finalBtn").onclick=()=>{
  $("ovMeta").textContent="Final Jeopardy · "+FINAL.c;
  $("ovDD").hidden=true;$("ovAns").textContent="";hideTimer();
  $("ovClue").textContent="Category: "+FINAL.c;
  say(HH().finCat(FINAL.c),"The category is "+FINAL.c);
  $("ovPre").innerHTML=S.teams.map((t,i)=>`<div class="wager"><label for="fw${i}">${esc(t.n)} <small>(max ${fmt(Math.max(0,t.s))})</small></label><input id="fw${i}" type="number" inputmode="numeric" min="0" step="100" value="0"></div>`).join("");
  $("ovAct").innerHTML=`<button class="btn big hot" id="fGo">Lock wagers &amp; show clue</button>`;
  $("ovAct").onclick=e=>{
    if(e.target.id!=="fGo")return;
    const W=S.teams.map((t,i)=>Math.min(Math.max(0,Math.round(+$("fw"+i).value||0)),Math.max(0,t.s)));
    $("ovPre").innerHTML=`<div class="meta">Wagers locked. Write your answers down!</div>`;
    $("ovClue").textContent=FINAL.q;
    say(HH().finQ+drawl(FINAL.q)+". "+HH().finEnd,HH().bFin,()=>{if(ov.classList.contains("open")&&!$("ovAns").textContent)startTimer(30)});
    revealBtn(FINAL.a,()=>{
      judges(i=>W[i],()=>{});
      const lead=()=>{const m=Math.max(...S.teams.map(t=>t.s));return S.teams.filter(t=>t.s===m).map(t=>t.n).join(" & ")};
      $("doneBtn").textContent="Crown the winner";
      $("doneBtn").onclick=ev=>{ev.stopPropagation();$("ovPre").innerHTML="";$("ovMeta").textContent="Game over";$("ovClue").innerHTML='<svg class="bigturk" aria-hidden="true"><use href="#tk"/></svg><br>';$("ovClue").append(lead()+" wins!");gobble();setTimeout(()=>say(HH().win(lead()),lead()+" wins!"),3400);$("ovAns").textContent=S.teams.map(t=>t.n+": "+fmt(t.s)).join("   ·   ");$("ovAct").innerHTML=`<button class="btn big hot" id="endBtn">Back to board</button>`;$("ovAct").onclick=x=>{if(x.target.id==="endBtn")closeOv()};save()};
    });
  };
  openOv();
};

/* reset with two-step confirm */
let armed=null;
$("resetBtn").onclick=()=>{
  const b=$("resetBtn");
  if(!armed){b.textContent="Click again to reset";b.classList.add("warn");armed=setTimeout(()=>{armed=null;b.textContent="New game";b.classList.remove("warn")},3000);return}
  clearTimeout(armed);armed=null;b.textContent="New game";b.classList.remove("warn");
  const names=S.teams.map(t=>({n:t.n,s:0}));S=fresh();S.teams=names;render();
};
$("fsBtn").onclick=()=>{try{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen().catch(()=>{})}catch(e){}};

function paintMode(){
  $("bKids").setAttribute("aria-pressed",MODE==="kids");$("bAdults").setAttribute("aria-pressed",MODE==="adults");
  $("hostUse").setAttribute("href",HH().svg);$("hostSel").value=hostFor();
  sndBtn.textContent=(MODE==="adults"?"Gospel: ":"Beat: ")+(sound?"on":"off");
}
function setMode(m){
  if(m===MODE)return;hideTimer();hush();if(ov.classList.contains("open"))closeOv();
  MODE=m;try{localStorage.setItem("tg-jeopardy-mode",m)}catch(e){}
  setData();load();paintMode();render();
}
$("hostSel").onchange=()=>{HOSTSEL[MODE]=$("hostSel").value;try{localStorage.setItem(hostKey(),HOSTSEL[MODE])}catch(e){};hush();paintMode();say(pick(HH().intros),"Hey there!")};
$("bKids").onclick=()=>setMode("kids");$("bAdults").onclick=()=>setMode("adults");
const oldSnd=sndBtn.onclick;sndBtn.onclick=()=>{oldSnd();paintMode()};
paintMode();
render();
}
</script>
